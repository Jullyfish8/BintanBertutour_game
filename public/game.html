<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Otak Together</title><style>
@font-face{font-family:Fugaz;src:url('/fonts/FugazOne-Regular.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#202a29;color:#fff9eb;font:16px system-ui}button,input{font:inherit;border-radius:30px;padding:14px 22px;border:0}button{background:#be774b;color:white;cursor:pointer;box-shadow:0 4px 0 #784a30;font-family:Fugaz,system-ui}button:active{transform:translateY(2px);box-shadow:0 2px 0 #784a30}input{width:150px;text-transform:uppercase}a{color:inherit}main{max-width:960px;margin:auto;padding:30px 20px}header{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:2px}h1,h2,.display{font-family:Fugaz,system-ui}h1{font-size:52px;line-height:1.1}p{line-height:1.5}.badge{font-size:11px}.error{color:#ffcead}#join{margin:30px 0}#join button{margin:6px}#roominfo{font-size:12px;overflow-wrap:anywhere}footer{font-size:11px;opacity:.65;margin-top:25px}.playing #error:empty{display:none}.playing #error:not(:empty){position:fixed;top:65px;z-index:40;background:#6d241e;padding:12px}.playing main{max-width:none;padding:0}.playing header,.playing h1,.playing #intro,.playing footer{display:none}.playing #roominfo{position:fixed;top:0;left:0;z-index:30;padding:8px 12px;background:#172721b0;max-width:100%;border-radius:0 0 14px 0;font-size:10px}.playing #roominfo p{display:none}.panels{display:flex;justify-content:center;gap:20px}.panel{height:100svh;min-height:560px;max-height:1000px;width:min(100vw,480px);position:relative;overflow:hidden;isolation:isolate;background:#76b2c1 url('/art/House.png') center bottom/auto 130% no-repeat;container-type:inline-size;touch-action:pan-y}.scene-label{position:absolute;top:44px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;font-size:10px;text-shadow:0 1px 5px #000;z-index:8;text-transform:uppercase;letter-spacing:1px}.clock{position:absolute;top:29%;width:100%;text-align:center;font-size:70px;color:#c67e50;-webkit-text-stroke:2px white;paint-order:stroke fill;filter:drop-shadow(0 3px 1px #543b2d);z-index:9;line-height:1.1}.instruction{position:absolute;top:40%;width:100%;text-align:center;font:18px Fugaz;color:white;text-shadow:0 2px 5px #000;z-index:9}.table{position:absolute;bottom:0;height:16%;width:100%;background:repeating-linear-gradient(15deg,#eed8b9 0px,#d9bd9b 2px,#efdbc0 5px,#ecd5b7 12px);border-top:4px solid #e8c99e;z-index:1;box-shadow:0 -4px 15px #0003}.grill{position:absolute;bottom:8%;left:0;width:100%;height:24%;z-index:4;pointer-events:none}.grill-base,.grill-fire{position:absolute;width:100%;height:auto;top:50%;transform:translateY(-52%);pointer-events:none}.grill-fire{opacity:0;transition:opacity .15s}.grill.fanning{filter:drop-shadow(0 0 10px #ff9d34aa)}.grill.too-hot .grill-fire{opacity:1;animation:firelight .22s ease-in-out infinite alternate}.grill.too-hot{filter:drop-shadow(0 0 13px #ff501eaa)}@keyframes firelight{from{filter:brightness(1)}to{filter:brightness(1.16)}}.parcels{position:absolute;inset:0;z-index:2}.parcel{position:absolute;width:20%;left:calc(30% + var(--i)*10%);top:-5%;transform:translate(-50%,-20%) rotate(-55deg);filter:drop-shadow(1px 3px 2px #0008)}.parcel-tap{pointer-events:auto;touch-action:manipulation;cursor:pointer;background:none;border:0;border-radius:0;padding:0;box-shadow:none;min-width:44px;min-height:44px}.parcel-tap img{display:block;width:100%;pointer-events:none}.parcel-tap:hover{filter:drop-shadow(0 0 7px #fff4b5)}.parcel-tap:focus-visible{outline:3px solid #fff4b5;outline-offset:3px}.parcel-tap:active{transform:translate(-50%,-20%) rotate(-55deg) scale(.94);box-shadow:none}.flip-overlay{pointer-events:none;background:transparent;align-items:flex-start;padding-top:20%}.flip-overlay .card{width:90%;padding:16px}.flip-overlay .card h2{font-size:30px;margin-bottom:6px}.parcel.cooked{filter:brightness(.55) saturate(.7)}.fan{position:absolute;left:0;bottom:0;width:100%;height:34%;z-index:6;user-select:none;-webkit-user-select:none;touch-action:none;cursor:ew-resize}.fan-icon{position:absolute;width:52%;left:24%;bottom:4%;transform:translateX(var(--fan-x,0px));pointer-events:none;user-select:none;-webkit-user-drag:none;will-change:transform;filter:drop-shadow(0 5px 5px #0003)}.fan.controllable{z-index:6;height:48%}.fan.controllable .fan-icon{bottom:26%;left:14%}.fan.remote{bottom:31%;height:16%;z-index:3;pointer-events:none}.fan.remote .fan-icon{width:27%;left:37%;bottom:0;transition:transform .16s linear}.heat-ui{position:absolute;bottom:4%;width:74%;left:13%;z-index:9}.meter{height:24px;background:linear-gradient(90deg,#fff 0 40%,#4bff78 40% 70%,#ff5c5c 70%);border:3px solid #151918;border-radius:30px;position:relative;overflow:hidden;box-shadow:0 2px 0 #fff8}.arrow{position:absolute;top:-9px;transform:translateX(-50%);font-size:28px;line-height:1;color:#111}.legend{display:flex;justify-content:space-between;color:#30291f;font-size:8px;font-weight:700;margin-top:4px}.play-hint{position:absolute;bottom:1%;width:100%;text-align:center;color:#362b21;font-size:10px;z-index:10;pointer-events:none}.fanning-player .play-hint{bottom:1.5%}.overlay{position:absolute;inset:0;z-index:15;display:flex;justify-content:center;align-items:center;background:#162c2438;padding:22px}.card{width:100%;text-align:center;background:#fff6e9ee;color:#493b2e;border:2px solid #fff6e9;border-radius:24px;padding:24px 18px;box-shadow:0 12px 40px #0003;backdrop-filter:blur(8px)}.card h2{font-size:38px;color:#ba764d;margin:0 0 16px}.card p{font-size:14px}.results{background:#eedcc5;border-radius:14px;padding:4px 12px}.preview .panel{width:min(46vw,430px)}@media(max-width:620px){.preview .panels{overflow-x:auto;justify-content:start;gap:8px;scroll-snap-type:x mandatory}.preview .panel{width:94vw;flex:0 0 94vw;scroll-snap-align:start}}@media(prefers-reduced-motion:reduce){.grill.too-hot .grill-fire{animation:none}.fan.remote .fan-icon{transition:none}}
</style><main><header><span>Bintan · Bertutour</span><span>Play together</span></header><h1>Otak<br>Together.</h1><p id="intro">One fans. One guides.<br>Two batches. Ten otak-otak.</p><section id="join"><button onclick="create(false)">Create room</button><button onclick="create(true)">Preview both phones</button><p>Join your partner</p><input id="code" placeholder="Room code" maxlength="6" autocapitalize="characters" aria-label="Room code"><button onclick="join()">Join</button></section><p id="error" class="error" role="status"></p><div id="roominfo"></div><div class="panels" id="panels"></div><footer>Gameplay prototype · Cooking is a game abstraction.</footer></main><script>
let room='',player=0,preview=false,offset=0,state=null,busy=false,lastY=null,lastX=null,dir=0,distance=0,lastSend=0,fanX=0,localFanAt=0,activeFan=null;
const $=id=>document.getElementById(id);
async function api(action,extra={}){try{let r=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,room,player,...extra})});let d=await r.json();if(d.error){$('error').textContent=d.error;return null}return d}catch(e){$('error').textContent='Connection interrupted. Check the server and try again.';return null}}
async function create(both){let d=await api('create');if(d){room=d.room;player=0;preview=both;enter()}}
async function join(){room=$('code').value.trim().toUpperCase();let d=await api('join');if(d){player=d.player;enter()}}
async function enter(){$('join').hidden=true;document.body.classList.add('playing');document.body.classList.toggle('preview',preview);sessionStorage.setItem('otak-room',JSON.stringify({room,player,preview}));let link=location.origin+'/game.html?room='+room;$('roominfo').innerHTML=`<span class="badge">Room ${room}</span><p>Partner: open <a href="${link}">${link}</a> on their phone, then join.</p>`;poll()}
function quality(a){return a.includes('Burnt')?'Burnt':a.includes('Undercooked')?'Undercooked':'Well-done'}
function panel(p){
 const fan=p===state.batch,phase=state.phase,done=state.batch===1;
 const active=phase==='cooking'||phase==='countdown';
 let overlay='';
 if(phase==='lobby')overlay=`<h2>Kipas!</h2><p>One fans. One guides.<br>Cook five otak-otak together.</p><button onclick="act('start',${p})">Start game</button>`;
 if(phase==='flip')overlay=`<h2>${state.results.at(-1)}</h2><p>${fan?'Stop fanning. Your partner flips!':'Tap an otak-otak to flip the batch.'}</p>`;
 if(phase==='result')overlay=`<h2>${done?'Siap!':'Swap roles!'}</h2><div class="results">${[0,...(done?[1]:[])].map(b=>`<p>Batch ${b+1} · 5 otak-otak<br><strong>${quality(state.results.slice(b*2,b*2+2))}</strong><br><small>${state.results[b*2]} / ${state.results[b*2+1]}</small></p>`).join('')}</div><p>${done?'Ten otak-otak. One team.':'Your partner fans the next batch.'}</p><button onclick="act('${done?'reset':'start'}',${p})">${done?'Play again':'Start batch two'}</button>`;
 const cooked=state.results[state.batch*2]==='Burnt';
 return `<section class="panel ${fan?'fanning-player':'observing-player'}" data-player="${p}">
 <div class="scene-label"><span>Player ${p?'B':'A'} · ${fan?'Fan':'Guide'}</span><span>Batch ${state.batch+1} · Side ${state.side+1}</span></div>
 ${active?`<div class="clock display">${remaining()}</div><div class="instruction">${phase==='countdown'?'Get ready':fan?'Kipas!':'Guide your partner'}</div>`:''}
 <div class="table" aria-hidden="true"></div>
 <div class="grill" aria-label="Otak-otak grill"><img class="grill-base" src="/art/Grill-least-fire.png" alt=""><img class="grill-fire" src="/art/Grill-fire.png" alt=""><div class="parcels">${Array.from({length:5},(_,i)=>phase==='flip'&&!fan?`<button class="parcel parcel-tap ${cooked?'cooked':''}" style="--i:${i}" onclick="act('flip',${p})" aria-label="Flip otak-otak ${i+1} and the batch"><img src="/art/Otak-raw.png" alt="" draggable="false"></button>`:`<img class="parcel ${cooked?'cooked':''}" style="--i:${i}" src="/art/Otak-raw.png" alt="Otak-otak ${i+1}">`).join('')}</div></div>
 ${active?`<div class="fan ${fan?'controllable':'remote'}" data-player="${p}" ${fan?'role="application" aria-label="Drag the fan left and right"':'aria-label="Your partner’s fan"'}><img class="fan-icon" src="/art/Fan.png" alt="Woven fan" draggable="false"></div>`:''}
 ${active&&!fan?`<div class="heat-ui"><div class="meter" role="meter" aria-label="Cooking heat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.heat}"><span class="arrow" style="left:${state.heat}%">▽</span></div><div class="legend"><span>Undercooked</span><span>Well-done</span><span>Burnt</span></div></div>`:''}
 ${active?`<div class="play-hint">${fan?'Swipe left ↔ right · Listen to your partner':'Watch the heat · Tell your partner when to slow down'}</div>`:''}
 ${overlay?`<div class="overlay ${phase==='flip'?'flip-overlay':''}"><div class="card">${overlay}</div></div>`:''}
 </section>`;
}
function remaining(){return Math.max(0,Math.ceil(state.until-(Date.now()/1000+offset)))}
let signature='';
function render(){
 const key=[state.phase,state.batch,state.side,state.results.join()].join('|');
 if(key!==signature){$('panels').innerHTML=(preview?[0,1]:[player]).map(panel).join('');signature=key;activeFan=null;lastX=null;fanX=0;pendingHeat=0;pendingPlayer=null;}
 document.querySelectorAll('.clock').forEach(el=>el.textContent=remaining());
 document.querySelectorAll('.arrow').forEach(el=>el.style.left=state.heat+'%');
 document.querySelectorAll('.meter').forEach(el=>el.setAttribute('aria-valuenow',Math.round(state.heat)));
 document.querySelectorAll('.fan').forEach(f=>{const local=Number(f.dataset.player)===state.batch;f.style.setProperty('--fan-x',((local?fanX:state.fanPosition||0)*100)+'px')});
 paintGrills();
}
async function act(action,p){if(busy)return;busy=true;try{await api(action,{player:p});signature='';}finally{busy=false;}}
async function poll(){if(room){try{let r=await fetch('/api/game?room='+room);state=await r.json();if(state.error){$('roominfo').textContent=state.error;return}offset=state.serverTime-Date.now()/1000;render()}catch(e){$('roominfo').textContent='Connection lost. Reconnecting…'}}setTimeout(poll,180)}
function paintGrills(){
 if(!state)return;
 const hot=state.phase==='cooking'&&state.heat>70;
 const now=Date.now()/1000+offset;
 const fanning=state.phase==='cooking'&&(Date.now()-localFanAt<500||now-(state.lastFan||0)<0.5);
 document.querySelectorAll('.grill').forEach(g=>{g.classList.toggle('too-hot',hot);g.classList.toggle('fanning',!hot&&fanning)});
}
setInterval(paintGrills,100);
let pendingHeat=0,fanRequest=false,pendingPlayer=null;
function queueFan(p){pendingPlayer=p;flushFan()}
async function flushFan(){
 if(fanRequest||pendingPlayer===null)return;
 const p=pendingPlayer;pendingPlayer=null;fanRequest=true;
 const amount=Math.min(9,pendingHeat);pendingHeat=0;
 await api('fan',{player:p,position:fanX,amount,seq:Date.now()});
 setTimeout(()=>{fanRequest=false;flushFan()},70);
}

document.addEventListener('pointerdown',e=>{
 const f=e.target.closest('.fan');if(!f||state?.phase!=='cooking'||!e.isPrimary)return;
 e.preventDefault();f.setPointerCapture(e.pointerId);activeFan=f;lastX=e.clientX;dir=0;distance=0;
});
function releaseFan(){if(activeFan)queueFan(Number(activeFan.dataset.player));lastX=null;activeFan=null;dir=0;distance=0}
document.addEventListener('pointerup',releaseFan);
document.addEventListener('pointercancel',releaseFan);
document.addEventListener('lostpointercapture',releaseFan);
document.addEventListener('pointermove',e=>{
 const f=activeFan;if(!f||lastX===null||state.phase!=='cooking')return;
 const dx=e.clientX-lastX;lastX=e.clientX;if(Math.abs(dx)<1)return;
 const limit=Math.min(100,f.closest('.panel').clientWidth*0.26);
 fanX=Math.max(-1,Math.min(1,fanX+dx/limit));f.style.setProperty('--fan-x',(fanX*100)+'px');
 localFanAt=Date.now();paintGrills();
 const next=Math.sign(dx);distance+=Math.abs(dx);
 if(next&&dir&&next!==dir&&distance>18){pendingHeat+=7;distance=0}
 if(next)dir=next;queueFan(Number(f.dataset.player));
});
let initial=new URLSearchParams(location.search).get('room');let saved;try{saved=JSON.parse(sessionStorage.getItem('otak-room'))}catch(e){}if(initial)$('code').value=initial;if(saved&&(!initial||saved.room===initial)){room=saved.room;player=saved.player;preview=saved.preview;enter()}
</script></html>
