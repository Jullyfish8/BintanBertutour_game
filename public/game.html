<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otak Together — gameplay prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5eddb;color:#263a30;font:17px system-ui}main{max-width:1000px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center}small,.label{font-size:12px;letter-spacing:2px;text-transform:uppercase}h1{font: bold 42px Georgia;margin:12px 0}h2{font: bold 28px Georgia}p{line-height:1.6}button,input{font:inherit;border-radius:12px;padding:13px 18px;border:1px solid #c4c8b8}button{background:#275b45;color:white;cursor:pointer}input{width:150px;text-transform:uppercase;background:white}button:disabled{opacity:.5}a{color:#275b45}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;margin-top:24px}.panel{background:#fffaf0;border:1px solid #d9d6c5;border-radius:24px;padding:24px;overflow:hidden}.grill{background:repeating-linear-gradient(0deg,#202d29 0 6px,#38473b 7px 12px);border-radius:18px;padding:28px 12px;display:flex;justify-content:center;gap:9px;margin:24px 0;box-shadow:0 8px 0 #adb4a0}.grill{transition:box-shadow .12s,background .12s}.grill.fanning{background:repeating-linear-gradient(0deg,#522e1a 0 6px,#e38b32 7px 12px);box-shadow:inset 0 -18px 36px #ff8a00aa,0 0 24px #f79c4266,0 8px 0 #a66d38}.grill.too-hot{background:repeating-linear-gradient(0deg,#631a15 0 6px,#ff4435 7px 12px);box-shadow:inset 0 -20px 40px #ff291acc,0 0 30px #f0443588,0 8px 0 #a63b2e}.parcel{width:35px;height:120px;background:linear-gradient(90deg,#65824a,#a2ad60,#4e713d);border:2px solid #385530;border-radius:45% 12%;transform:rotate(8deg);box-shadow:3px 4px 5px #1118}.parcel.burn{filter:brightness(.4)}.fan{touch-action:none;user-select:none;background:#e1e9d7;border:2px dashed #9aa98b;border-radius:20px;text-align:center;padding:20px;cursor:ew-resize}.fan-icon{font-size:66px;display:block;transform:translateX(var(--fan-x,0px));will-change:transform;pointer-events:none}.meter{position:relative;height:56px;background:linear-gradient(90deg,#9bbfce 0 40%,#9bca77 40% 70%,#db8a62 70%);border-radius:14px;margin:36px 0 8px}.arrow{position:absolute;top:-24px;transform:translateX(-50%);font-size:28px}.legend{display:flex;justify-content:space-between;font-size:12px}.clock{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}.badge{display:inline-block;background:#e4e8d7;padding:7px 12px;border-radius:30px;font-size:13px}.hint{min-height:54px}.error{color:#a33626}#join{margin:30px 0}.results{padding:15px;background:#e4e8d7;border-radius:12px}footer{margin-top:25px;font-size:13px;opacity:.7}button+button{margin-left:8px}@media(max-width:500px){h1{font-size:34px}main{padding:20px 14px}}
</style><main><header><small>Bintan · Play together</small><span class="badge">Gameplay prototype</span></header><h1>Otak Together</h1><p id="intro">One fans. One guides. Cook two batches of five together.</p><section id="join"><button onclick="create(false)">Create room</button> <button onclick="create(true)">Preview both phones</button><p>Or join your partner: <input id="code" placeholder="Room code" maxlength="6" autocapitalize="characters" aria-label="Room code"> <button onclick="join()">Join</button></p><p id="error" class="error"></p></section><div id="roominfo"></div><div class="panels" id="panels"></div><footer>Swipe control only · Cooking quality is a game abstraction · No personal information is requested.</footer></main><script>
let room='',player=0,preview=false,offset=0,state=null,busy=false,lastY=null,lastX=null,dir=0,distance=0,lastSend=0,fanX=0,localFanAt=0,activeFan=null;
const $=id=>document.getElementById(id);
async function api(action,extra={}){try{let r=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,room,player,...extra})});let d=await r.json();if(d.error){$('error').textContent=d.error;return null}return d}catch(e){$('error').textContent='Connection interrupted. Check the server and try again.';return null}}
async function create(both){let d=await api('create');if(d){room=d.room;player=0;preview=both;enter()}}
async function join(){room=$('code').value.trim().toUpperCase();let d=await api('join');if(d){player=d.player;enter()}}
async function enter(){$('join').hidden=true;sessionStorage.setItem('otak-room',JSON.stringify({room,player,preview}));let link=location.origin+'/game.html?room='+room;$('roominfo').innerHTML=`<span class="badge">Room ${room}</span><p>Partner: open <a href="${link}">${link}</a> on their phone, then join.</p>`;poll()}
function quality(a){return a.includes('Burnt')?'Burnt':a.includes('Undercooked')?'Undercooked':'Well-done'}
function panel(p){let fan=p===state.batch,phase=state.phase;let time=Math.max(0,Math.ceil(state.until-(Date.now()/1000+offset)));let completed=state.results.length;let side=state.side?'Second side':'First side';let content='';
if(phase==='lobby')content=`<h2>Ready to cook?</h2><p>A fans the first batch. B watches the heat and calls out directions. Swap roles for batch two.</p><button onclick="act('start',${p})">Start game</button>`;
else if(phase==='result'){let done=state.batch===1;content=`<h2>${done?'Two batches, together!':'Batch one complete'}</h2><div class="results">${[0,...(done?[1]:[])].map(b=>`<p>Batch ${b+1} · 5 otak-otak<br><strong>${quality(state.results.slice(b*2,b*2+2))}</strong><br><small>Side 1: ${state.results[b*2]} · Side 2: ${state.results[b*2+1]}</small></p>`).join('')}</div><p>${done?'How did your coordination go? Try again and find your rhythm.':'Swap roles: B fans next, A guides and flips.'}</p><button onclick="act('${done?'reset':'start'}',${p})">${done?'Play again':'Start batch two'}</button>`}
else if(phase==='flip')content=`<h2>${state.results[completed-1]}</h2><p>First side finished. Stop fanning!</p>${fan?'<p>Your partner will flip the five parcels.</p>':`<button onclick="act('flip',${p})">Flip all five ↻</button>`}`;
else content=`<div class="clock">${phase==='countdown'?time:time+'s'}</div><p>${phase==='countdown'?'Get ready…':side+' · '+(fan?'Listen to your partner':'Guide your partner')}</p>${fan?`<div class="fan" data-player="${p}"><span class="fan-icon">🪭</span><strong>Swipe left and right</strong><p>Faster raises the heat.<br>Slowing down lets it fall.</p></div>`:`<div class="meter"><span class="arrow" style="left:${state.heat}%">▼</span></div><div class="legend"><span>Undercooked</span><strong>Well-done</strong><span>Burnt</span></div><p class="hint">${phase==='countdown'?'Watch the arrow when cooking begins.':'Tell your partner: “'+(state.heat<40?'Faster!':state.heat>70?'Slow down!':'Keep that pace!')+'”'}</p>`}`;
return `<section class="panel"><span class="label">Player ${p?'B':'A'} · ${fan?'Fanning':'Guiding'}</span><p class="badge">Batch ${state.batch+1} / 2 · 5 parcels</p><div class="grill">${Array.from({length:5},()=>'<div class="parcel"></div>').join('')}</div>${content}</section>`}
let signature='';function render(){let key=[state.phase,state.batch,state.side,state.results.join()].join('|');if(key!==signature){$('panels').innerHTML=(preview?[0,1]:[player]).map(panel).join('');signature=key;activeFan=null;lastX=null;fanX=0}else{document.querySelectorAll('.clock').forEach(el=>el.textContent=Math.max(0,Math.ceil(state.until-(Date.now()/1000+offset)))+(state.phase==='cooking'?'s':''));document.querySelectorAll('.arrow').forEach(el=>el.style.left=state.heat+'%');document.querySelectorAll('.hint').forEach(el=>el.textContent='Tell your partner: “'+(state.heat<40?'Faster!':state.heat>70?'Slow down!':'Keep that pace!')+'”')}paintGrills()}
async function act(action,p){await api(action,{player:p});signature='';}
async function poll(){if(room){try{let r=await fetch('/api/game?room='+room);state=await r.json();if(state.error){$('roominfo').textContent=state.error;return}offset=state.serverTime-Date.now()/1000;render()}catch(e){$('roominfo').textContent='Connection lost. Reconnecting…'}}setTimeout(poll,180)}
function paintGrills(){
 if(!state)return;
 const hot=state.phase==='cooking'&&state.heat>70;
 const now=Date.now()/1000+offset;
 const fanning=state.phase==='cooking'&&(Date.now()-localFanAt<500||now-(state.lastFan||0)<0.5);
 document.querySelectorAll('.grill').forEach(g=>{g.classList.toggle('too-hot',hot);g.classList.toggle('fanning',!hot&&fanning)});
}
setInterval(paintGrills,100);
document.addEventListener('pointerdown',e=>{
 const f=e.target.closest('.fan');if(!f||state?.phase!=='cooking'||!e.isPrimary)return;
 e.preventDefault();f.setPointerCapture(e.pointerId);activeFan=f;lastX=e.clientX;dir=0;distance=0;
});
function releaseFan(){lastX=null;activeFan=null;dir=0;distance=0}
document.addEventListener('pointerup',releaseFan);
document.addEventListener('pointercancel',releaseFan);
document.addEventListener('lostpointercapture',releaseFan);
document.addEventListener('pointermove',e=>{
 const f=activeFan;if(!f||lastX===null||state.phase!=='cooking')return;
 const dx=e.clientX-lastX;lastX=e.clientX;if(Math.abs(dx)<1)return;
 const limit=Math.max(0,(f.clientWidth-100)/2);
 fanX=Math.max(-limit,Math.min(limit,fanX+dx));f.style.setProperty('--fan-x',fanX+'px');
 localFanAt=Date.now();paintGrills();
 const next=Math.sign(dx);distance+=Math.abs(dx);
 if(next&&dir&&next!==dir&&distance>18&&Date.now()-lastSend>100){lastSend=Date.now();api('swipe',{player:Number(f.dataset.player),amount:7});distance=0}
 if(next)dir=next;
});
let initial=new URLSearchParams(location.search).get('room');let saved;try{saved=JSON.parse(sessionStorage.getItem('otak-room'))}catch(e){}if(initial)$('code').value=initial;if(saved&&(!initial||saved.room===initial)){room=saved.room;player=saved.player;preview=saved.preview;enter()}
</script></html>
